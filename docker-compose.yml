services:
  neo4j:
    # 5.18+ 才有 vector.similarity.cosine() 函数,graphiti-core 依赖它
    # 5.26 是 2026 年的 LTS
    image: neo4j:5.26-community
    container_name: screenplay-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/testpassword
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./data/neo4j:/data

  api:
    # FastAPI layer. `docker compose up` brings up Neo4j + this together.
    # Lives on the host network so CORS calls from browser → http://localhost:8000
    # hit the same port the frontend was configured against.
    image: python:3.11-slim
    container_name: screenplay-api
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      # Point at the neo4j service by container-internal hostname.
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpassword
      # Forward OpenRouter credentials from the host environment.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_API_BASE=${OPENROUTER_API_BASE:-https://openrouter.ai/api/v1}
      - CHAT_MODEL=${CHAT_MODEL:-qwen/qwen-2.5-72b-instruct}
      - CHAT_SMALL_MODEL=${CHAT_SMALL_MODEL:-qwen/qwen-2.5-7b-instruct}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-4096}
      - API_ALLOWED_ORIGINS=${API_ALLOWED_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
    command: >
      sh -c "pip install -e '.[api]' &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
