[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenplay-memory"
version = "0.1.0"
description = "PoC: Graphiti + Neo4j + Qwen2.5 Chinese screenplay knowledge graph"
requires-python = ">=3.10"
dependencies = [
    "graphiti-core>=0.3.0",
    "neo4j>=5.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff",
    "httpx",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "python-multipart",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
